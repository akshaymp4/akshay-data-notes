    <text x="250" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#b45309">22.4%</text>
    <rect x="398" y="172" width="150" height="80" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="418" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">Orders</text>
    <text x="418" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#334155">8,940</text>
  </g>
  <rect x="62" y="280" width="320" height="162" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="86" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#334155">Sales by Product</text>
  <rect x="96" y="338" width="214" height="16" fill="#14b8a6"/>
  <rect x="96" y="370" width="250" height="16" fill="#f59e0b"/>
  <rect x="96" y="402" width="172" height="16" fill="#64748b"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">
