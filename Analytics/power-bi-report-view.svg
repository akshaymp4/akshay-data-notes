  <rect x="406" y="280" width="210" height="162" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="430" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#334155">Monthly Trend</text>
  <polyline points="432,398 464,374 496,382 528,338 560,354 592,326" fill="none" stroke="#0f766e" stroke-width="5"/>
  <circle cx="592" cy="326" r="6" fill="#f59e0b"/>
  <rect x="642" y="172" width="178" height="270" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="664" y="204" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#334155">Region Matrix</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">
