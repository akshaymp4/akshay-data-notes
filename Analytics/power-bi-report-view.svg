<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Power BI report page mock screenshot</title>
  <desc id="desc">A simplified sales dashboard page with slicers, KPI cards, bar chart, line chart, and matrix visual.</desc>
  <rect width="900" height="520" rx="18" fill="#fff7ed"/>
  <rect x="32" y="32" width="836" height="456" rx="16" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
  <text x="62" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#7c2d12">Executive Sales Dashboard</text>
  <rect x="62" y="104" width="166" height="42" rx="8" fill="#fffbeb" stroke="#fde68a"/>
  <text x="82" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#92400e">Year: 2026</text>
  <rect x="246" y="104" width="166" height="42" rx="8" fill="#fffbeb" stroke="#fde68a"/>
  <text x="266" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#92400e">Region: All</text>
